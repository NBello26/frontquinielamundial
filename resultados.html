<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados Fase de Grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Tabla General</a></li>
                    <li class="nav-item"><a class="nav-link active" href="resultados.html">Resultados Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="playoffs.html">Resultados Playoffs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="text-center mb-4">⚽ Resultados Reales - Fase de Grupos</h2>
        <div id="contenedor-resultados" class="row g-3">
            <div class="text-center">Cargando partidos...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';

        async function cargarPartidos() {
            try {
                const res = await fetch(`${API_URL}/matches`);
                const partidos = await res.json();
                const contenedor = document.getElementById('contenedor-resultados');
                contenedor.innerHTML = '';
                
                partidos.forEach(m => {
                    const grupoStr = m.group || "";
                    // Filtramos: SOLO DEJAMOS LOS DE FASE DE GRUPOS
                    if (grupoStr.length <= 1) {
                        const jugado = m.realGoalsA !== null && m.realGoalsB !== null;
                        
                        const col = document.createElement('div');
                        col.className = "col-md-6 col-lg-4";
                        col.innerHTML = `
                            <div class="card shadow-sm mb-2">
                                <div class="card-body py-3">
                                    <div class="text-muted small mb-1 text-center fw-bold text-uppercase">Grupo ${grupoStr}</div>
                                    <div class="row align-items-center m-0">
                                        <div class="col-4 text-end fw-bold text-truncate">${m.teamA}</div>
                                        <div class="col-4 text-center px-1">
                                            ${jugado ? 
                                                `<span class="badge bg-success fs-5 px-2 py-2 w-100">${m.realGoalsA} - ${m.realGoalsB}</span>` : 
                                                `<span class="badge bg-secondary fs-6 px-2 py-2 w-100 text-white-50">VS</span>`
                                            }
                                        </div>
                                        <div class="col-4 text-start fw-bold text-truncate">${m.teamB}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                        contenedor.appendChild(col);
                    }
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }
        cargarPartidos();
    </script>
</body>
</html>
