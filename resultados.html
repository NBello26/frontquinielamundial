<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
                            Posiciones
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="index.html">Tabla General</a></li>
                            <li><a class="dropdown-item fw-bold text-primary" href="posiciones-playoffs.html">Tabla Playoffs 🏆</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="playoffs.html">🏆 Playoffs</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <ul class="nav nav-tabs mb-4 justify-content-center" id="resultadosTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active fw-bold" id="grupos-tab" data-bs-toggle="tab" data-bs-target="#grupos-pane" type="button" role="tab">⚽ Fase de Grupos</button>
    </li>
    <li class="nav-item">
        <button class="nav-link fw-bold" id="playoffs-tab" data-bs-toggle="tab" data-bs-target="#playoffs-pane" type="button" role="tab">🏆 Playoffs (Eliminatorias)</button>
    </li>
</ul>

<div class="tab-content" id="resultadosTabsContent">
    <div class="tab-pane fade show active" id="grupos-pane" role="tabpanel">
        <div id="contenedor-grupos" class="row g-3"></div>
    </div>
    <div class="tab-pane fade" id="playoffs-pane" role="tabpanel">
        <div id="contenedor-resultados-playoffs" class="row g-3"></div>
    </div>
</div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        const ADMIN_PASSWORD = 'familia2026';

        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            
            // Corregido: Alternar la clase d-none para ocultar/mostrar sin romper Flexbox
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.toggle('d-none', !isAdmin);
            });
            
            // Cambiar el estilo del botón de iniciar/cerrar sesión
            const btnAuth = document.getElementById('btn-auth');
            if(btnAuth) {
                btnAuth.innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
                btnAuth.className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
            }
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                alert('Sesión cerrada');
                if(window.location.href.includes('admin') || window.location.href.includes('editar')) {
                    window.location.href = 'index.html';
                } else {
                    verificarAdmin();
                }
            } else {
                const pass = prompt('Introduce la contraseña de administrador:');
                if (pass === ADMIN_PASSWORD) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada como administrador!');
                    verificarAdmin();
                } else if (pass !== null) {
                    alert('Contraseña incorrecta');
                }
            }
        }

        verificarAdmin();

        async function cargarPartidos() {
        try {
            const res = await fetch(`${API_URL}/matches`);
            const partidos = await res.json();
            
            const conGrupos = document.getElementById('contenedor-grupos');
            const conPlayoffs = document.getElementById('contenedor-resultados-playoffs');
            
            conGrupos.innerHTML = '';
            conPlayoffs.innerHTML = '';
            
            partidos.forEach(m => {
                const jugado = m.realGoalsA !== null && m.realGoalsB !== null;
                const col = document.createElement('div');
                col.className = "col-md-6 col-lg-4";
                col.innerHTML = `
                    <div class="card shadow-sm mb-2">
                        <div class="card-body py-3">
                            <div class="text-muted small mb-1 text-center fw-bold text-uppercase">${m.group.length === 1 ? 'Grupo ' + m.group : m.group}</div>
                            <div class="row align-items-center m-0">
                                <div class="col-4 text-end fw-bold text-truncate" title="${m.teamA}">${m.teamA}</div>
                                <div class="col-4 text-center px-1">
                                    ${jugado ? 
                                        `<span class="badge bg-success fs-5 px-2 py-2 w-100">${m.realGoalsA} - ${m.realGoalsB}</span>` : 
                                        `<span class="badge bg-secondary fs-6 px-2 py-2 w-100 text-white-50">VS</span>`
                                    }
                                </div>
                                <div class="col-4 text-start fw-bold text-truncate" title="${m.teamB}">${m.teamB}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Clasificación automática por longitud del campo 'group'
                if (m.group && m.group.length > 1) {
                    conPlayoffs.appendChild(col);
                } else {
                    conGrupos.appendChild(col);
                }
            });
        } catch (error) {
            console.error("Error:", error);
        }
    }
        
        cargarPartidos();
    </script>
</body>
</html>
