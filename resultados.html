<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados Fase de Grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Posiciones
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="index.html">Tabla General</a></li>
                            <li><a class="dropdown-item fw-bold text-primary" href="posiciones-playoffs.html">Tabla Playoffs 🏆</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="playoffs.html">🏆 Playoffs</a></li>
                    <li class="nav-item"><a class="nav-link active" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="text-center mb-4">⚽ Resultados Reales - Fase de Grupos</h2>
        <div id="contenedor-resultados">
            <div class="text-center text-muted py-5">⏳ Cargando partidos...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';

        // 1. CARGA Y RENDERIZADO DE PARTIDOS
        async function cargarPartidos() {
            try {
                const res = await fetch(`${API_URL}/matches`);
                const partidos = await res.json();
                const contenedor = document.getElementById('contenedor-resultados');
                contenedor.innerHTML = '';
                
                const gruposMap = {}; // { "A": [partido1, partido2], "B": [...] }

                // Agrupamos únicamente los partidos de la Fase de Grupos
                partidos.forEach(m => {
                    const grupoStr = m.group || "";
                    if (grupoStr.length <= 1) { // Si es de 1 letra, es Fase de Grupos
                        if (!gruposMap[grupoStr]) gruposMap[grupoStr] = [];
                        gruposMap[grupoStr].push(m);
                    }
                });

                const listaGrupos = Object.keys(gruposMap).sort();

                if (listaGrupos.length === 0) {
                    contenedor.innerHTML = '<div class="alert alert-info text-center">Aún no hay partidos registrados.</div>';
                    return;
                }

                // Renderizamos por bloques de Grupos
                listaGrupos.forEach(g => {
                    const seccionGrupo = document.createElement('div');
                    seccionGrupo.className = "mb-5";
                    seccionGrupo.innerHTML = `<h3 class="border-bottom pb-2 text-primary fw-bold">📊 Grupo ${g}</h3>`;
                    
                    const filaTarjetas = document.createElement('div');
                    filaTarjetas.className = "row g-3";

                    gruposMap[g].forEach(m => {
                        const jugado = m.realGoalsA !== null && m.realGoalsB !== null;
                        
                        const col = document.createElement('div');
                        col.className = "col-md-6 col-lg-4";
                        col.innerHTML = `
                            <div class="card shadow-sm border-light h-100">
                                <div class="card-body text-center d-flex flex-column justify-content-center py-3">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <div class="fw-bold text-truncate w-100 text-end pe-2" style="max-width:40%;" title="${m.teamA}">${m.teamA}</div>
                                        <div class="badge ${jugado ? 'bg-success' : 'bg-secondary'} fs-5 px-3 py-1 mx-1 shadow-sm">
                                            ${jugado ? `${m.realGoalsA} - ${m.realGoalsB}` : 'VS'}
                                        </div>
                                        <div class="fw-bold text-truncate w-100 text-start ps-2" style="max-width:40%;" title="${m.teamB}">${m.teamB}</div>
                                    </div>
                                    <small class="${jugado ? 'text-success fw-bold' : 'text-muted'} d-block mt-2">
                                        ${jugado ? '✓ Resultado Final' : '⏳ Por Jugar'}
                                    </small>
                                </div>
                            </div>
                        `;
                        filaTarjetas.appendChild(col);
                    });

                    seccionGrupo.appendChild(filaTarjetas);
                    contenedor.appendChild(seccionGrupo);
                });

            } catch (error) {
                console.error("Error al cargar resultados:", error);
                document.getElementById('contenedor-resultados').innerHTML = '<div class="alert alert-danger text-center">Error al conectar con el servidor.</div>';
            }
        }

        // 2. FUNCIONES DE SEGURIDAD PARA LA NAVBAR UNIFICADA
        function checkAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            
            document.querySelectorAll('.admin-only').forEach(el => {
                if (isAdmin) el.classList.remove('d-none');
                else el.classList.add('d-none');
            });
            
            const btnAuth = document.getElementById('btn-auth');
            if (btnAuth) {
                if (isAdmin) {
                    btnAuth.textContent = "Cerrar Sesión (Admin)";
                    btnAuth.className = "btn btn-outline-danger ms-3 btn-sm";
                } else {
                    btnAuth.textContent = "Iniciar Sesión";
                    btnAuth.className = "btn btn-outline-light ms-3 btn-sm";
                }
            }
        }

        function toggleAuth() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            if (isAdmin) {
                localStorage.removeItem('isAdmin');
                alert('Sesión de administrador cerrada correctamente.');
                window.location.reload();
            } else {
                const pass = prompt('Ingresa la contraseña de administrador:');
                if (pass === 'familia2026') { // Reemplaza "familia2026" por tu contraseña real
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada con éxito!');
                    window.location.reload();
                } else if (pass !== null) {
                    alert('Contraseña incorrecta.');
                }
            }
        }

        // Ejecutar funciones al arrancar la página
        window.onload = function() {
            checkAdmin();
            cargarPartidos();
        };
    </script>
</body>
</html>
