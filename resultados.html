<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Posiciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 800px;">
        <h2 class="text-center mb-4">Resultados de los Partidos</h2>

        <ul class="nav nav-pills justify-content-center mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#fecha1">Fecha 1</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#fecha2">Fecha 2</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#fecha3">Fecha 3</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="fecha1"><div class="row" id="lista-fecha1"></div></div>
            <div class="tab-pane fade" id="fecha2"><div class="row" id="lista-fecha2"></div></div>
            <div class="tab-pane fade" id="fecha3"><div class="row" id="lista-fecha3"></div></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        const ADMIN_PASSWORD = 'familia2026';

        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            
            // Corregido: Alternar la clase d-none para ocultar/mostrar sin romper Flexbox
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.toggle('d-none', !isAdmin);
            });
            
            // Cambiar el estilo del botón de iniciar/cerrar sesión
            const btnAuth = document.getElementById('btn-auth');
            if(btnAuth) {
                btnAuth.innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
                btnAuth.className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
            }
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                alert('Sesión cerrada');
                if(window.location.href.includes('admin') || window.location.href.includes('editar')) {
                    window.location.href = 'index.html';
                } else {
                    verificarAdmin();
                }
            } else {
                const pass = prompt('Introduce la contraseña de administrador:');
                if (pass === ADMIN_PASSWORD) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada como administrador!');
                    verificarAdmin();
                } else if (pass !== null) {
                    alert('Contraseña incorrecta');
                }
            }
        }

        verificarAdmin();

        async function cargarPartidos() {
            try {
                const response = await fetch(`${API_URL}/matches`);
                const matches = await response.json();

                matches.forEach((m, index) => {
                    let contenedorId = 'lista-fecha1';
                    
                    // Mejora: Se intenta usar una propiedad de la API (round o fecha).
                    // Si no existe, usamos la validación por índices (index) como respaldo.
                    if (m.round === 2 || m.fecha === 2 || (index >= 24 && index < 48)) {
                        contenedorId = 'lista-fecha2';
                    } else if (m.round === 3 || m.fecha === 3 || index >= 48) {
                        contenedorId = 'lista-fecha3';
                    }

                    const contenedor = document.getElementById(contenedorId);
                    
                    // Si por alguna razón el contenedor no existe, evitamos que el código se rompa
                    if (!contenedor) return; 

                    const col = document.createElement('div');
                    col.className = 'col-12 mb-2';
                    
                    const valA = m.realGoalsA ?? '';
                    const valB = m.realGoalsB ?? '';
                    const jugado = valA !== '' && valB !== '';

                    col.innerHTML = `
                        <div class="card shadow-sm border-0">
                            <div class="card-body py-3">
                                <div class="row align-items-center m-0">
                                    <div class="col-4 text-end fw-bold fs-5 text-truncate" title="${m.teamA}">${m.teamA}</div>
                                    
                                    <div class="col-4 text-center">
                                        ${jugado ? 
                                            `<span class="badge bg-success fs-5 px-3 py-2 w-100 shadow-sm">${valA} - ${valB}</span>
                                             <small class="text-success mt-1 d-block fw-bold" style="font-size: 0.75rem;">Finalizado</small>` 
                                            : 
                                            `<span class="badge bg-secondary fs-6 px-3 py-2 w-100 text-white-50">VS</span>
                                             <small class="text-muted mt-1 d-block" style="font-size: 0.75rem;">Por jugar</small>`
                                        }
                                    </div>
                                    
                                    <div class="col-4 text-start fw-bold fs-5 text-truncate" title="${m.teamB}">${m.teamB}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(col);
                });
            } catch (error) {
                console.error("Error cargando partidos:", error);
            }
        }
        
        cargarPartidos();
    </script>
</body>
</html>
