<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Posiciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Posiciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item admin-only" style="display: none;"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only" style="display: none;"><a class="btn btn-success ms-3 btn-sm" href="nuevo-participante.html">+ Nuevo Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Tabla de Posiciones</h2>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Participante</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-participantes">
                        <tr><td colspan="3" class="text-center">Cargando posiciones...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api/participants';
        const ADMIN_PASSWORD = 'familia2026';

        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'block' : 'none');
            document.getElementById('btn-auth').innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
            document.getElementById('btn-auth').className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                alert('Sesión cerrada');
                verificarAdmin();
            } else {
                const pass = prompt('Introduce la contraseña de administrador:');
                if (pass === ADMIN_PASSWORD) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada como administrador!');
                    verificarAdmin();
                } else if (pass !== null) {
                    alert('Contraseña incorrecta');
                }
            }
        }

        async function cargarParticipantes() {
            try {
                const response = await fetch(API_URL);
                const participants = await response.json();
                const tbody = document.getElementById('tabla-participantes');
                tbody.innerHTML = '';

                participants.forEach((p, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${index + 1}</td><td>${p.name}</td><td><strong class="fs-5">${p.totalPoints}</strong></td>`;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        verificarAdmin();
        cargarParticipantes();
    </script>
</body>
</html>
