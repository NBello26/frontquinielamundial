<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Nuevo Participante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Script de protección inmediata -->
    <script>
        if (localStorage.getItem('isAdmin') !== 'true') {
            alert('Acceso denegado. Solo el administrador puede añadir participantes.');
            window.location.href = 'index.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Posiciones</a></li>
    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="partidos.html">Partidos y Resultados</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Inscribir Participante y Predicciones</h2>
        
        <div class="card shadow-sm p-4 mb-4">
            <label class="form-label fw-bold">Nombre del Participante:</label>
            <input type="text" id="nombre-participante" class="form-control" placeholder="Ej. Tío Juan">
        </div>

        <h4 class="mb-3">Ingresa tus predicciones:</h4>
        <div id="lista-predicciones" class="row">
            <div class="col-12 text-center">Cargando partidos...</div>
        </div>

        <button id="btn-guardar" class="btn btn-success btn-lg w-100 mt-4" onclick="guardarTodo()" style="display:none;">
            Confirmar Participación
        </button>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        let partidosDisponibles = [];

        async function cargarFormularioPartidos() {
            try {
                const response = await fetch(`${API_URL}/matches`);
                partidosDisponibles = await response.json();
                
                const contenedor = document.getElementById('lista-predicciones');
                contenedor.innerHTML = '';

                partidosDisponibles.forEach(m => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 mb-3';
                    col.innerHTML = `
                        <div class="card">
                            <div class="card-body text-center">
                                <h6>${m.teamA} vs ${m.teamB}</h6>
                                <div class="d-flex justify-content-center mt-2">
                                    <input type="number" id="predA-${m.id}" class="form-control text-center w-25" placeholder="0" min="0">
                                    <span class="mx-2">-</span>
                                    <input type="number" id="predB-${m.id}" class="form-control text-center w-25" placeholder="0" min="0">
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(col);
                });
                document.getElementById('btn-guardar').style.display = 'block';
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function guardarTodo() {
            const nombre = document.getElementById('nombre-participante').value.trim();
            if (!nombre) { alert('Por favor ingresa un nombre.'); return; }

            try {
                const resPart = await fetch(`${API_URL}/participants`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nombre })
                });
                const participanteCreado = await resPart.json();
                const participantId = participanteCreado.id;

                const promesasPredicciones = partidosDisponibles.map(m => {
                    const golesA = document.getElementById(`predA-${m.id}`).value || 0;
                    const golesB = document.getElementById(`predB-${m.id}`).value || 0;
                    return fetch(`${API_URL}/predictions/${participantId}/${m.id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ goalsA: parseInt(golesA), goalsB: parseInt(golesB) })
                    });
                });

                await Promise.all(promesasPredicciones);
                alert('¡Participante y predicciones guardadas!');
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Error:", error);
            }
        }

        cargarFormularioPartidos();
    </script>
</body>
</html>
