<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Grupos - Mundial 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Posiciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 700px;">
        <h3 class="text-center mb-4">Posiciones por Grupo</h3>
        
        <!-- Selector de Grupos A-L -->
        <div class="mb-4">
            <select id="select-grupo" class="form-select form-select-lg border-primary shadow-sm" onchange="actualizarTabla()">
                <option value="A">Grupo A</option>
                <option value="B">Grupo B</option>
                <option value="C">Grupo C</option>
                <option value="D">Grupo D</option>
                <option value="E">Grupo E</option>
                <option value="F">Grupo F</option>
                <option value="G">Grupo G</option>
                <option value="H">Grupo H</option>
                <option value="I">Grupo I</option>
                <option value="J">Grupo J</option>
                <option value="K">Grupo K</option>
                <option value="L">Grupo L</option>
            </select>
        </div>

        <div class="card shadow-sm">
            <table class="table table-hover align-middle text-center mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-start ps-3">Equipo</th>
                        <th>PJ</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <!-- Los datos se cargan aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';

        async function actualizarTabla() {
            const grupoSeleccionado = document.getElementById('select-grupo').value;
            const tablaBody = document.getElementById('tabla-body');
            tablaBody.innerHTML = '<tr><td colspan="3">Cargando...</td></tr>';

            try {
                const response = await fetch(`${API_URL}/matches`);
                const matches = await response.json();
                
                // Filtramos partidos solo del grupo seleccionado (ajusta según cómo guardes el campo "group" en tu API)
                const partidosGrupo = matches.filter(m => m.group === grupoSeleccionado);
                
                const stats = {};
                partidosGrupo.forEach(m => {
                    [m.teamA, m.teamB].forEach(t => { if(!stats[t]) stats[t] = { pts: 0, pj: 0 }; });
                    
                    if (m.realGoalsA !== null && m.realGoalsB !== null) {
                        stats[m.teamA].pj++; stats[m.teamB].pj++;
                        if (m.realGoalsA > m.realGoalsB) stats[m.teamA].pts += 3;
                        else if (m.realGoalsA < m.realGoalsB) stats[m.teamB].pts += 3;
                        else { stats[m.teamA].pts += 1; stats[m.teamB].pts += 1; }
                    }
                });

                const equiposOrdenados = Object.keys(stats).sort((a, b) => stats[b].pts - stats[a].pts);
                
                tablaBody.innerHTML = equiposOrdenados.map(t => `
                    <tr>
                        <td class="text-start ps-3 fw-bold">${t}</td>
                        <td>${stats[t].pj}</td>
                        <td class="fw-bold text-primary">${stats[t].pts}</td>
                    </tr>
                `).join('');

            } catch (e) {
                tablaBody.innerHTML = '<tr><td colspan="3">Error al cargar datos.</td></tr>';
            }
        }

        // Carga inicial
        actualizarTabla();
    </script>
</body>
</html>
