<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Editar Participante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <script>
        if (localStorage.getItem('isAdmin') !== 'true') {
            alert('Acceso denegado. Solo el administrador puede editar participantes.');
            window.location.href = 'index.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
                            Posiciones
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="index.html">Tabla General</a></li>
                            <li><a class="dropdown-item fw-bold text-primary" href="posiciones-playoffs.html">Tabla Playoffs 🏆</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="playoffs.html">🏆 Playoffs</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 800px;">
        <h2 class="text-center mb-4">Editar Predicciones de Participantes</h2>
        
        <div class="card shadow-sm border-0 mb-4 bg-white">
            <div class="card-body p-4">
                <label for="select-participante" class="form-label fw-bold text-secondary">Elige al familiar que vas a editar:</label>
                <select id="select-participante" class="form-select form-select-lg border-primary shadow-sm" onchange="cargarPrediccionesDelParticipante()">
                    <option value="">Cargando participantes...</option>
                </select>
            </div>
        </div>

        <div id="formulario-edicion" class="d-none">
            <ul class="nav nav-pills justify-content-center mb-4 bg-white p-2 rounded shadow-sm" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation"><button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#edit-fecha1">Fecha 1</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#edit-fecha2">Fecha 2</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#edit-fecha3">Fecha 3</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="edit-fecha1"><div class="row" id="lista-edit-fecha1"></div></div>
                <div class="tab-pane fade" id="edit-fecha2"><div class="row" id="lista-edit-fecha2"></div></div>
                <div class="tab-pane fade" id="edit-fecha3"><div class="row" id="lista-edit-fecha3"></div></div>
            </div>

            <button id="btn-guardar" class="btn btn-success btn-lg w-100 mt-4 shadow fw-bold py-3" onclick="guardarCambios()">
                💾 Guardar Todos los Cambios de este Familiar
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        let partidosGlobales = [];
        const ADMIN_PASSWORD = 'familia2026';

        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.toggle('d-none', !isAdmin);
            });
            
            const btnAuth = document.getElementById('btn-auth');
            if(btnAuth) {
                btnAuth.innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
                btnAuth.className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
            }
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                alert('Sesión cerrada');
                window.location.href = 'index.html';
            } else {
                const pass = prompt('Introduce la contraseña de administrador:');
                if (pass === ADMIN_PASSWORD) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada como administrador!');
                    verificarAdmin();
                } else if (pass !== null) {
                    alert('Contraseña incorrecta');
                }
            }
        }

        verificarAdmin();

        async function inicializar() {
            try {
                // 1. Cargar la lista de participantes ordenados alfabéticamente
                const resPart = await fetch(`${API_URL}/participants`);
                const participants = await resPart.json();
                const select = document.getElementById('select-participante');
                
                if (select) {
                    select.innerHTML = '<option value="">Selecciona un participante...</option>';
                    participants.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.id;
                        option.textContent = p.name;
                        select.appendChild(option);
                    });
                }

                // 2. Cargar y estructurar los 72 partidos en memoria
                const resMatches = await fetch(`${API_URL}/matches`);
                partidosGlobales = await resMatches.json();

                partidosGlobales.forEach(match => {
                    let contenedorId = 'lista-edit-fecha1';
                    if (match.id >= 25 && match.id <= 48) contenedorId = 'lista-edit-fecha2';
                    if (match.id > 48) contenedorId = 'lista-edit-fecha3';
                    
                    const contenedor = document.getElementById(contenedorId);
                    if (!contenedor) return;

                    const col = document.createElement('div');
                    col.className = 'col-12 mb-2';
                    col.innerHTML = `
                        <div class="card shadow-sm border-0">
                            <div class="card-body py-2 px-3">
                                <div class="row align-items-center m-0">
                                    <div class="col-4 text-end fw-bold fs-6 text-truncate p-0" title="${match.teamA}">${match.teamA}</div>
                                    <div class="col-4 px-1">
                                        <div class="d-flex justify-content-center align-items-center">
                                            <input type="number" id="predA-${match.id}" class="form-control text-center fw-bold border-secondary shadow-sm" placeholder="-" min="0" style="width: 55px; height: 38px;">
                                            <span class="mx-2 fw-bold text-muted">-</span>
                                            <input type="number" id="predB-${match.id}" class="form-control text-center fw-bold border-secondary shadow-sm" placeholder="-" min="0" style="width: 55px; height: 38px;">
                                        </div>
                                    </div>
                                    <div class="col-4 text-start fw-bold fs-6 text-truncate p-0" title="${match.teamB}">${match.teamB}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(col);
                });

            } catch (error) {
                console.error("Error al inicializar la administración:", error);
            }
        }

        async function cargarPrediccionesDelParticipante() {
            const participanteId = document.getElementById('select-participante').value;
            const formEdicion = document.getElementById('formulario-edicion');
            
            if (!formEdicion) return;

            if (!participanteId) {
                formEdicion.classList.add('d-none');
                return;
            }

            formEdicion.classList.remove('d-none');

            // Limpiamos los inputs anteriores de manera segura
            partidosGlobales.forEach(m => {
                const inpA = document.getElementById(`predA-${m.id}`);
                const inpB = document.getElementById(`predB-${m.id}`);
                if (inpA) inpA.value = '';
                if (inpB) inpB.value = '';
            });

            // Traemos las predicciones reales del backend del participante elegido
            try {
                const response = await fetch(`${API_URL}/participants/${participanteId}`);
                const data = await response.json();
                
                if (data && data.predictions) {
                    data.predictions.forEach(pred => {
                        const inputA = document.getElementById(`predA-${pred.matchId}`);
                        const inputB = document.getElementById(`predB-${pred.matchId}`);
                        if(inputA && inputB) {
                            inputA.value = pred.goalsA ?? '';
                            inputB.value = pred.goalsB ?? '';
                        }
                    });
                }
            } catch (error) {
                console.error("Error al cargar predicciones del familiar:", error);
            }
        }

        async function guardarCambios() {
            const participanteId = document.getElementById('select-participante').value;
            if (!participanteId) return;

            const boton = document.getElementById('btn-guardar');
            if (!boton) return;

            boton.innerHTML = 'Guardando cambios en el servidor... ⏳';
            boton.disabled = true;

            const promesas = [];

            // Recorremos los inputs para procesar las predicciones válidas completadas
            partidosGlobales.forEach(m => {
                const valA = document.getElementById(`predA-${m.id}`).value;
                const valB = document.getElementById(`predB-${m.id}`).value;

                // Enviamos únicamente los registros que contengan goles en ambos inputs
                if (valA !== '' && valB !== '') {
                    promesas.push(
                        fetch(`${API_URL}/predictions/${participanteId}/${m.id}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ goalsA: parseInt(valA, 10), goalsB: parseInt(valB, 10) })
                        })
                    );
                }
            });

            try {
                await Promise.all(promesas);
                alert('¡Todas las predicciones del participante se actualizaron con éxito!');
            } catch (error) {
                console.error("Error al ejecutar Promise.all al guardar predicciones:", error);
                alert('Ocurrió un inconveniente al intentar guardar algunas predicciones. Verifica tu conexión.');
            } finally {
                boton.innerHTML = '💾 Guardar Todos los Cambios de este Familiar';
                boton.disabled = false;
                // Refrescamos los valores visuales trayéndolos limpios desde la base de datos
                cargarPrediccionesDelParticipante();
            }
        }

        // Encendido automático al cargar la ventana
        inicializar();
    </script>
</body>
</html>
