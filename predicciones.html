<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Predicciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Posiciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link active" href="predicciones.html">Predicciones</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 800px;">
        <h2 class="text-center mb-4">Ver Predicciones por Participante</h2>

        <div class="card shadow-sm border-0 mb-4 bg-white">
            <div class="card-body">
                <label for="select-participante" class="form-label fw-bold">Elige a un participante:</label>
                <select id="select-participante" class="form-select form-select-lg" onchange="cargarPredicciones()">
                    <option value="">Cargando participantes...</option>
                </select>
            </div>
        </div>

        <div id="lista-predicciones" class="row">
            <div class="col-12 text-center text-muted mt-3">
                <p>Selecciona un nombre arriba para ver su quiniela.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';

        // 1. Cargar la lista desplegable
        async function cargarListaParticipantes() {
            try {
                const response = await fetch(`${API_URL}/participants`);
                const participants = await response.json();
                
                const select = document.getElementById('select-participante');
                select.innerHTML = '<option value="">Selecciona un participante...</option>';

                // Ordenamos alfabéticamente para que sea más fácil buscarlos
                participants.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.textContent = `${p.name} (${p.totalPoints} pts)`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('select-participante').innerHTML = '<option value="">Error al cargar</option>';
            }
        }

        // 2. Cargar los partidos cuando seleccionan a alguien
        async function cargarPredicciones() {
            const participanteId = document.getElementById('select-participante').value;
            const contenedor = document.getElementById('lista-predicciones');
            
            if (!participanteId) {
                contenedor.innerHTML = '<div class="col-12 text-center text-muted mt-3"><p>Selecciona un nombre arriba para ver su quiniela.</p></div>';
                return;
            }

            contenedor.innerHTML = '<div class="col-12 text-center mt-3"><div class="spinner-border text-primary" role="status"></div><p>Cargando quiniela...</p></div>';

            try {
                const response = await fetch(`${API_URL}/participants/${participanteId}`);
                const data = await response.json();
                
                contenedor.innerHTML = '';

                if (!data.predictions || data.predictions.length === 0) {
                    contenedor.innerHTML = '<div class="col-12 text-center text-danger mt-3">Este participante no tiene predicciones registradas.</div>';
                    return;
                }

                data.predictions.forEach(pred => {
                    const col = document.createElement('div');
                    col.className = 'col-12 mb-3';
                    
                    const match = pred.match;
                    const realA = match.realGoalsA ?? '';
                    const realB = match.realGoalsB ?? '';
                    const jugado = realA !== '' && realB !== '';

                    // Mostrar el resultado real abajo de la predicción si ya se jugó
                    const textoReal = jugado 
                        ? `<span class="text-success fw-bold">Real: ${realA} - ${realB}</span>` 
                        : `<span class="text-muted">Por jugar</span>`;

                    col.innerHTML = `
                        <div class="card shadow-sm border-0">
                            <div class="card-body py-3">
                                <div class="row align-items-center m-0">
                                    <div class="col-4 text-end fw-bold fs-6 text-truncate" title="${match.teamA}">${match.teamA}</div>
                                    
                                    <div class="col-4 text-center">
                                        <span class="badge bg-primary fs-5 px-3 py-2 w-100 shadow-sm" title="Su predicción">
                                            ${pred.goalsA} - ${pred.goalsB}
                                        </span>
                                        <small class="d-block mt-1" style="font-size: 0.75rem;">${textoReal}</small>
                                    </div>
                                    
                                    <div class="col-4 text-start fw-bold fs-6 text-truncate" title="${match.teamB}">${match.teamB}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(col);
                });
            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = '<div class="col-12 text-center text-danger mt-3">Error al cargar las predicciones.</div>';
            }
        }

        // Iniciar cargando la lista
        cargarListaParticipantes();
    </script>
</body>
</html>
