<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Editar Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <script>
        if (localStorage.getItem('isAdmin') !== 'true') {
            alert('Acceso denegado. Solo el administrador puede entrar aquí.');
            window.location.href = 'index.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="index.html">🛡️ Panel de Administrador</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Volver al Inicio</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 800px;">
        <h2 class="text-center mb-4">Ingresar o Editar Resultados</h2>

        <ul class="nav nav-pills justify-content-center mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#admin-fecha1">Fecha 1</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#admin-fecha2">Fecha 2</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#admin-fecha3">Fecha 3</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="admin-fecha1"><div class="row" id="admin-lista-fecha1"></div></div>
            <div class="tab-pane fade" id="admin-fecha2"><div class="row" id="admin-lista-fecha2"></div></div>
            <div class="tab-pane fade" id="admin-fecha3"><div class="row" id="admin-lista-fecha3"></div></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';

        async function cargarPartidosAdmin() {
            try {
                const response = await fetch(`${API_URL}/matches`);
                const matches = await response.json();

                matches.forEach((m, index) => {
                    let contenedorId = 'admin-lista-fecha1';
                    if (index >= 24 && index < 48) contenedorId = 'admin-lista-fecha2';
                    if (index >= 48) contenedorId = 'admin-lista-fecha3';

                    const contenedor = document.getElementById(contenedorId);
                    const col = document.createElement('div');
                    col.className = 'col-12 mb-3';
                    
                    // Extraer los valores exactamente como vienen, respetando el cero
                    const valA = m.realGoalsA ?? '';
                    const valB = m.realGoalsB ?? '';
                    const jugado = valA !== '' && valB !== '';
                    
                    const borde = jugado ? 'border border-success border-2' : 'border-0';
                    const textoBoton = jugado ? 'Actualizar' : 'Guardar';
                    const colorBoton = jugado ? 'btn-outline-success' : 'btn-primary';

                    col.innerHTML = `
                        <div class="card shadow-sm ${borde}">
                            <div class="card-body py-3">
                                <div class="row align-items-center m-0">
                                    <div class="col-4 text-end fw-bold fs-6 text-truncate" title="${m.teamA}">${m.teamA}</div>
                                    
                                    <div class="col-4 px-0">
                                        <div class="d-flex justify-content-center align-items-center">
                                            <input type="number" id="golesA-${m.id}" class="form-control text-center px-1 fw-bold" value="${valA}" min="0" style="max-width: 50px;">
                                            <span class="mx-2 fw-bold text-muted">-</span>
                                            <input type="number" id="golesB-${m.id}" class="form-control text-center px-1 fw-bold" value="${valB}" min="0" style="max-width: 50px;">
                                        </div>
                                        <div class="text-center mt-2">
                                            <button class="btn ${colorBoton} btn-sm px-3 fw-bold" onclick="guardarResultado(${m.id})">${textoBoton}</button>
                                        </div>
                                    </div>
                                    
                                    <div class="col-4 text-start fw-bold fs-6 text-truncate" title="${m.teamB}">${m.teamB}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(col);
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function guardarResultado(matchId) {
            const golesA = document.getElementById(`golesA-${matchId}`).value;
            const golesB = document.getElementById(`golesB-${matchId}`).value;

            if (golesA === '' || golesB === '') {
                alert('Debes ingresar los goles de ambos equipos para guardar.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/matches/${matchId}/result`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ goalsA: parseInt(golesA), goalsB: parseInt(golesB) })
                });

                if (response.ok) {
                    alert('¡Resultado guardado correctamente!');
                    location.reload(); 
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar. Intenta nuevamente.");
            }
        }

        cargarPartidosAdmin();
    </script>
</body>
</html>
