<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Playoffs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
                            Posiciones
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="index.html">Tabla General</a></li>
                            <li><a class="dropdown-item fw-bold text-primary" href="posiciones-playoffs.html">Tabla Playoffs 🏆</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="playoffs.html">🏆 Playoffs</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 800px;">
        <h2 class="text-center mb-4">🏆 Fase Eliminatoria</h2>

        <div class="d-flex justify-content-center flex-wrap gap-2 mb-4">
            <a href="#fase-16avos" class="btn btn-outline-primary btn-sm rounded-pill">16avos</a>
            <a href="#fase-Octavos" class="btn btn-outline-primary btn-sm rounded-pill">Octavos</a>
            <a href="#fase-Cuartos" class="btn btn-outline-primary btn-sm rounded-pill">Cuartos</a>
            <a href="#fase-Semifinal" class="btn btn-outline-primary btn-sm rounded-pill">Semifinal</a>
            <a href="#fase-Final" class="btn btn-warning btn-sm rounded-pill fw-bold">Final</a>
        </div>

        <div id="contenedor-playoffs">
            <div class="text-center text-muted"><div class="spinner-border spinner-border-sm text-primary"></div> Cargando cuadro...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        const ADMIN_PASSWORD = 'familia2026';

        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.toggle('d-none', !isAdmin);
            });
            const btnAuth = document.getElementById('btn-auth');
            if(btnAuth) {
                btnAuth.innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
                btnAuth.className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
            }
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                alert('Sesión cerrada');
                window.location.reload();
            } else {
                const pass = prompt('Introduce la contraseña de administrador:');
                if (pass === ADMIN_PASSWORD) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada como administrador!');
                    verificarAdmin();
                }
            }
        }

        verificarAdmin();

        async function cargarPlayoffs() {
            try {
                const response = await fetch(`${API_URL}/matches`);
                const matches = await response.json();

                // Filtramos SOLO los partidos que son de playoffs (grupo con nombre largo)
                const playoffMatches = matches.filter(m => m.group && m.group.length > 1);
                
                const contenedor = document.getElementById('contenedor-playoffs');
                contenedor.innerHTML = '';

                if(playoffMatches.length === 0) {
                    contenedor.innerHTML = '<div class="alert alert-info text-center">Aún no se han definido los cruces de eliminatorias.</div>';
                    return;
                }

                // Agrupamos por fase
                const fases = ["16avos", "Octavos", "Cuartos", "Semifinal", "Tercer Puesto", "Final"];
                
                fases.forEach(fase => {
                    const partidosFase = playoffMatches.filter(m => m.group === fase);
                    
                    if(partidosFase.length > 0) {
                        const seccionFase = document.createElement('div');
                        seccionFase.id = `fase-${fase.replace(' ', '')}`;
                        seccionFase.className = 'mb-5';
                        
                        let tituloClass = 'bg-dark';
                        if(fase === 'Final') tituloClass = 'bg-warning text-dark';
                        
                        seccionFase.innerHTML = `<h4 class="text-center text-white py-2 rounded shadow-sm mb-3 ${tituloClass} fw-bold">${fase.toUpperCase()}</h4>`;
                        
                        const row = document.createElement('div');
                        row.className = 'row g-3';
                        
                        partidosFase.forEach(m => {
                            const valA = m.realGoalsA ?? '';
                            const valB = m.realGoalsB ?? '';
                            const jugado = valA !== '' && valB !== '';
                            
                            row.innerHTML += `
                                <div class="col-md-6">
                                    <div class="card shadow-sm border-0 h-100">
                                        <div class="card-body p-3 text-center">
                                            <div class="d-flex justify-content-between align-items-center mb-2">
                                                <div class="fw-bold fs-5 text-truncate w-100 text-end pe-2">${m.teamA}</div>
                                                <div class="badge ${jugado ? 'bg-success' : 'bg-secondary'} fs-5 px-3 py-1 shadow-sm mx-1">
                                                    ${jugado ? `${valA} - ${valB}` : 'VS'}
                                                </div>
                                                <div class="fw-bold fs-5 text-truncate w-100 text-start ps-2">${m.teamB}</div>
                                            </div>
                                            <small class="${jugado ? 'text-success fw-bold' : 'text-muted'}">
                                                ${jugado ? 'Finalizado' : 'Por Jugar'}
                                            </small>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        seccionFase.appendChild(row);
                        contenedor.appendChild(seccionFase);
                    }
                });

            } catch (error) {
                console.error("Error cargando playoffs:", error);
                document.getElementById('contenedor-playoffs').innerHTML = '<div class="alert alert-danger text-center">Error al cargar los partidos de eliminatoria.</div>';
            }
        }

        cargarPlayoffs();
    </script>
</body>
</html>
