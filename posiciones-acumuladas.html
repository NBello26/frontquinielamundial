<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Mundial - Tabla Acumulada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Posiciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="playoffs.html">🏆 Playoffs</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Predicciones</a></li>
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar</a></li>
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 800px;">
        <h2 class="text-center mb-3">📈 Tabla Acumulada</h2>
        
        <div class="d-flex justify-content-center mb-4">
            <div class="btn-group shadow-sm" role="group">
                <a href="index.html" class="btn btn-outline-primary">General</a>
                <a href="posiciones-playoffs.html" class="btn btn-outline-primary">Playoffs</a>
                <a href="posiciones-acumuladas.html" class="btn btn-primary fw-bold pe-none">Acumulada</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0">
                    <thead class="table-dark">
                        <tr><th class="text-center">#</th><th>Participante</th><th class="text-center">Total Pts</th></tr>
                    </thead>
                    <tbody id="tabla-acumulada"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        
        // Copiamos la lógica de Auth para que sea consistente
        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('d-none', !isAdmin));
            const btnAuth = document.getElementById('btn-auth');
            if(btnAuth) {
                btnAuth.innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
                btnAuth.className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
            }
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                window.location.reload();
            } else {
                const pass = prompt('Introduce la contraseña:');
                if (pass === 'familia2026') {
                    localStorage.setItem('isAdmin', 'true');
                    verificarAdmin();
                }
            }
        }

        async function cargarAcumulada() {
            try {
                const res = await fetch(`${API_URL}/participants`);
                const data = await res.json();
                const tbody = document.getElementById('tabla-acumulada');
                
                // Ordenamos por totalPoints directo
                data.sort((a, b) => b.totalPoints - a.totalPoints);

                data.forEach((p, i) => {
                    let icon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1;
                    tbody.innerHTML += `<tr><td class="text-center fw-bold">${icon}</td><td>${p.name}</td><td class="text-center"><span class="badge bg-dark">${p.totalPoints}</span></td></tr>`;
                });
            } catch (e) { console.error(e); }
        }

        verificarAdmin();
        cargarAcumulada();
    </script>
</body>
</html>
