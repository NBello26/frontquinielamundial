<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial - Por Partido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ Quiniela Mundial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Posiciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">📊 Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="resultados.html">Resultados</a></li>
                    <li class="nav-item"><a class="nav-link" href="predicciones.html">Por Persona</a></li>
                    <li class="nav-item"><a class="nav-link active" href="predicciones-partido.html">Por Partido</a></li>
                    
                    <li class="nav-item admin-only d-none"><a class="nav-link text-warning fw-bold" href="admin-resultados.html">⚙️ Editar Partidos</a></li>
                    <li class="nav-item admin-only d-none"><a class="btn btn-success ms-3 btn-sm" href="editar-participante.html">✏️ Editar Participante</a></li>
                    
                    <li class="nav-item"><button class="btn btn-outline-light ms-3 btn-sm" id="btn-auth" onclick="toggleAuth()">Iniciar Sesión</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" style="max-width: 1000px;"> <h2 class="text-center mb-4">Predicciones por Partido</h2>

        <div class="d-flex justify-content-center mb-4">
            <div class="btn-group shadow-sm" role="group" aria-label="Cambiar vista de predicciones">
                <a href="predicciones.html" class="btn btn-outline-primary px-4">👤 Por Participante</a>
                <button type="button" class="btn btn-primary active px-4">⚽ Por Partido</button>
            </div>
        </div>
        <div class="card shadow-sm border-0 mb-4 bg-white">
            <div class="card-body">
                <label for="select-partido" class="form-label fw-bold">Elige un partido:</label>
                <select id="select-partido" class="form-select form-select-lg border-success" onchange="cargarPrediccionesDelPartido()">
                    <option value="">Cargando partidos...</option>
                </select>
            </div>
        </div>

        <div id="mensaje-inicial" class="text-center text-muted mt-4">
            <p>Selecciona un partido arriba para ver qué apostó cada participante.</p>
        </div>

        <div id="info-partido-container" class="d-none mb-4 text-center">
            <h4 id="titulo-partido" class="fw-bold"></h4>
            <p id="resultado-real-partido" class="text-muted fs-5"></p>
        </div>

        <div id="contenedor-predicciones" class="d-none">
            <div class="row g-4" id="lista-predicciones">
                </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://quinielamundial-e3zh.onrender.com/api';
        const ADMIN_PASSWORD = 'familia2026';

        function verificarAdmin() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.toggle('d-none', !isAdmin);
            });
            const btnAuth = document.getElementById('btn-auth');
            if(btnAuth) {
                btnAuth.innerText = isAdmin ? 'Cerrar Sesión' : 'Iniciar Sesión';
                btnAuth.className = isAdmin ? 'btn btn-outline-danger ms-3 btn-sm' : 'btn btn-outline-light ms-3 btn-sm';
            }
        }

        function toggleAuth() {
            if (localStorage.getItem('isAdmin') === 'true') {
                localStorage.removeItem('isAdmin');
                alert('Sesión cerrada');
                window.location.href = 'index.html';
            } else {
                const pass = prompt('Introduce la contraseña de administrador:');
                if (pass === ADMIN_PASSWORD) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('¡Sesión iniciada como administrador!');
                    verificarAdmin();
                } else if (pass !== null) {
                    alert('Contraseña incorrecta');
                }
            }
        }

        verificarAdmin();

        function calcularPuntos(pA, pB, rA, rB) {
            const predA = parseInt(pA, 10);
            const predB = parseInt(pB, 10);
            const realA = parseInt(rA, 10);
            const realB = parseInt(rB, 10);

            // 5 puntos si acierta el resultado exacto
            if (predA === realA && predB === realB) return 5;
            
            // 3 puntos si acierta la tendencia (ganador o empate), pero no se suman con los 5
            const prediceEmpate = predA === predB;
            const fueEmpate = realA === realB;
            const prediceGanaA = predA > predB;
            const ganoA = realA > realB;
            const prediceGanaB = predA < predB;
            const ganoB = realA < realB;

            if ((prediceEmpate && fueEmpate) || (prediceGanaA && ganoA) || (prediceGanaB && ganoB)) {
                return 3;
            }
            return 0; // Si no acierta nada
        }

        async function cargarListaPartidos() {
            try {
                const response = await fetch(`${API_URL}/matches`);
                const matches = await response.json();
                
                const select = document.getElementById('select-partido');
                select.innerHTML = '<option value="">Selecciona un partido...</option>';

                matches.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m.id;
                    option.textContent = `Partido ${m.id}: ${m.teamA} vs ${m.teamB} (Grupo ${m.group})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Error cargando partidos:", error);
                document.getElementById('select-partido').innerHTML = '<option value="">Error al cargar</option>';
            }
        }

        async function cargarPrediccionesDelPartido() {
            const matchId = document.getElementById('select-partido').value;
            const msgInicial = document.getElementById('mensaje-inicial');
            const contInfo = document.getElementById('info-partido-container');
            const contPreds = document.getElementById('contenedor-predicciones');
            const lista = document.getElementById('lista-predicciones');
            
            if (!matchId) {
                msgInicial.classList.remove('d-none');
                contInfo.classList.add('d-none');
                contPreds.classList.add('d-none');
                return;
            }

            msgInicial.classList.add('d-none');
            lista.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-success" role="status"></div></div>';
            contInfo.classList.remove('d-none');
            contPreds.classList.remove('d-none');

            try {
                const response = await fetch(`${API_URL}/matches/${matchId}/predictions`);
                const data = await response.json();
                const match = data.match;
                const predictions = data.predictions;

                // Actualizar encabezado del partido
                document.getElementById('titulo-partido').textContent = `${match.teamA} vs ${match.teamB}`;
                
                const realA = match.realGoalsA ?? '';
                const realB = match.realGoalsB ?? '';
                const jugado = realA !== '' && realB !== '';

                document.getElementById('resultado-real-partido').innerHTML = jugado 
                    ? `Resultado Final: <span class="badge bg-dark">${realA} - ${realB}</span>`
                    : '<span class="badge bg-secondary">Aún por jugar</span>';

                if (predictions.length === 0) {
                    lista.innerHTML = '<div class="col-12"><div class="alert alert-info text-center">Nadie ha ingresado predicciones para este partido aún.</div></div>';
                    return;
                }

                // Arrays para separar las predicciones
                let apuestasGanaA = [];
                let apuestasEmpate = [];
                let apuestasGanaB = [];

                predictions.forEach(pred => {
                    const participante = pred.participant;
                    let puntosHTML = '';
                    let colorBorde = 'border-0';
                    const predText = `${pred.goalsA} - ${pred.goalsB}`;

                    if (jugado) {
                        const puntos = calcularPuntos(pred.goalsA, pred.goalsB, realA, realB);
                        if (puntos === 5) {
                            puntosHTML = `<span class="badge bg-success mt-1">+5 Pts</span>`;
                            colorBorde = 'border border-success border-2';
                        } else if (puntos === 3) {
                            puntosHTML = `<span class="badge bg-warning text-dark mt-1">+3 Pts</span>`;
                            colorBorde = 'border border-warning border-2';
                        } else {
                            puntosHTML = `<span class="badge bg-danger mt-1">0 Pts</span>`;
                            colorBorde = 'border border-danger opacity-75';
                        }
                    }

                    // Tarjeta individual de participante
                    const cardHTML = `
                        <div class="card shadow-sm mb-2 ${colorBorde}">
                            <div class="card-body p-2 d-flex justify-content-between align-items-center">
                                <div class="fw-bold text-truncate" style="font-size: 0.9rem; max-width: 65%;" title="${participante.name}">
                                    👤 ${participante.name}
                                </div>
                                <div class="text-end">
                                    <span class="badge bg-primary px-2 py-1">${predText}</span>
                                    <div style="font-size: 0.8rem;">${puntosHTML}</div>
                                </div>
                            </div>
                        </div>
                    `;

                    // Clasificamos la predicción
                    if (pred.goalsA > pred.goalsB) {
                        apuestasGanaA.push(cardHTML);
                    } else if (pred.goalsA === pred.goalsB) {
                        apuestasEmpate.push(cardHTML);
                    } else {
                        apuestasGanaB.push(cardHTML);
                    }
                });

                // Función auxiliar para renderizar listas o mostrar mensaje de "Vacío"
                const renderColumna = (arrayApostadores) => {
                    if (arrayApostadores.length === 0) {
                        return '<div class="text-center text-muted small py-3 bg-light rounded border">Nadie apostó por esto</div>';
                    }
                    return arrayApostadores.join('');
                };

                // Construimos el HTML final con las 3 columnas
                lista.innerHTML = `
                    <div class="col-md-4">
                        <div class="bg-white rounded shadow-sm p-3 h-100 border-top border-4 border-primary">
                            <h5 class="text-center fw-bold mb-3">Gana ${match.teamA} <br><small class="text-muted fw-normal">(${apuestasGanaA.length} apuestas)</small></h5>
                            ${renderColumna(apuestasGanaA)}
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="bg-white rounded shadow-sm p-3 h-100 border-top border-4 border-secondary">
                            <h5 class="text-center fw-bold mb-3">Empate <br><small class="text-muted fw-normal">(${apuestasEmpate.length} apuestas)</small></h5>
                            ${renderColumna(apuestasEmpate)}
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="bg-white rounded shadow-sm p-3 h-100 border-top border-4 border-primary">
                            <h5 class="text-center fw-bold mb-3">Gana ${match.teamB} <br><small class="text-muted fw-normal">(${apuestasGanaB.length} apuestas)</small></h5>
                            ${renderColumna(apuestasGanaB)}
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Error cargando detalles del partido:", error);
                lista.innerHTML = '<div class="col-12"><div class="alert alert-danger text-center">Hubo un error al cargar las predicciones.</div></div>';
            }
        }

        // Cargar el selector al iniciar
        cargarListaPartidos();
    </script>
</body>
</html>
